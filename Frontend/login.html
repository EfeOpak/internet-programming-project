
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexHabit - Giriş Yap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">FlexHabit ✳</a>
    </nav>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h1>Tekrar hoş geldin!</h1>
        <p>Alışkanlıklarına kaldığın yerden devam et.</p>

        <form>
            <label for="login-email">E-posta</label>
            <input type="email" id="login-email"
                   name="email" placeholder="ornek@mail.com" required>

            <label for="login-password">Şifre</label>
            <input type="password" id="login-password"
                   name="password" placeholder="Şifreni gir" required>

            <button type="submit" class="btn btn-primary">
                Giriş Yap
            </button>
        </form>

        <p class="auth-footer">
            Hesabın yok mu?
            <a href="register.html">Kayıt Ol</a>
        </p>
    </section>
</main>

</body>
</html>
