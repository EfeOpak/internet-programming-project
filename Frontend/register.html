
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexHabit - Kayıt Ol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">FlexHabit ✳</a>
    </nav>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h1>FlexHabit'e katıl!</h1>
        <p>Kendi ritminde ilerlemeye bugün başla.</p>

        <form>
            <label for="register-name">Kullanıcı adı</label>
            <input type="text" id="register-name"
                   name="username" placeholder="Kullanıcı adın" required>

            <label for="register-email">E-posta</label>
            <input type="email" id="register-email"
                   name="email" placeholder="ornek@mail.com" required>

            <label for="register-password">Şifre</label>
            <input type="password" id="register-password"
                   name="password" placeholder="Şifre oluştur"
                   minlength="8" required>

            <label for="register-confirm">Şifre Tekrar</label>
            <input type="password" id="register-confirm"
                   name="confirmPassword" placeholder="Şifreni tekrar gir"
                   minlength="8" required>

            <button type="submit" class="btn btn-primary">
                Kayıt Ol
            </button>
        </form>

        <p class="auth-footer">
            Zaten hesabın var mı?
            <a href="login.html">Giriş Yap</a>
        </p>
    </section>
</main>

</body>
</html>
